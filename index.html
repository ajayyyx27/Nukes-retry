<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Tracker</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%234F46E5'/><stop offset='100%25' style='stop-color:%2306B6D4'/></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><circle cx='50' cy='50' r='38' fill='none' stroke='rgba(255,255,255,0.4)' stroke-width='5' stroke-dasharray='180 240' stroke-linecap='round'/><path d='M30 55 L45 70 L75 35' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252540;
            --text: #e8e8f0;
            --text-muted: #8899aa;
            --primary: #4F46E5;
            --primary-glow: #06B6D4;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --orange: #f59e0b;
            --border: #2a2a44;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f0f2f8;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f7ff;
                --text: #1a1a2e;
                --text-muted: #6b7280;
                --border: #d1d5db;
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px 16px 100px 16px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .header-actions button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-actions button:active {
            transform: scale(0.95);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .month-nav button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .month-nav button:active {
            transform: scale(0.95);
        }
        .month-nav .month-label {
            font-size: 16px;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-grid .day-label {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 4px 0;
        }
        .calendar-grid .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            min-height: 40px;
        }
        .calendar-grid .day-cell:active {
            transform: scale(0.92);
        }
        .calendar-grid .day-cell .date {
            font-size: 13px;
            font-weight: 600;
        }
        .calendar-grid .day-cell .indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            margin-top: 2px;
        }
        .calendar-grid .day-cell .indicator.green { background: var(--green); }
        .calendar-grid .day-cell .indicator.yellow { background: var(--yellow); }
        .calendar-grid .day-cell .indicator.orange { background: var(--orange); }
        .calendar-grid .day-cell .indicator.red { background: var(--red); }
        .calendar-grid .day-cell .indicator.gray { background: var(--text-muted); opacity: 0.3; }
        .calendar-grid .day-cell.today {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(79, 70, 229, 0.25);
        }
        .calendar-grid .day-cell.future {
            opacity: 0.4;
            cursor: default;
        }
        .calendar-grid .day-cell.weekend {
            opacity: 0.3;
            cursor: default;
        }
        .calendar-grid .day-cell.excused {
            border-style: dashed;
            border-color: var(--primary);
            opacity: 0.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .stats-grid .stat-item {
            text-align: center;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 10px 4px;
            border: 1px solid var(--border);
        }
        .stats-grid .stat-item .number {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
        }
        .stats-grid .stat-item .number.green { color: var(--green); }
        .stats-grid .stat-item .number.red { color: var(--red); }
        .stats-grid .stat-item .number.blue { color: var(--primary); }
        .stats-grid .stat-item .number.yellow { color: var(--yellow); }
        .stats-grid .stat-item .label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .subject-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .subject-stat:last-child {
            border-bottom: none;
        }
        .subject-stat .name {
            font-weight: 500;
            font-size: 13px;
            min-width: 80px;
        }
        .subject-stat .pct {
            font-weight: 700;
            font-size: 13px;
            min-width: 40px;
            text-align: right;
        }
        .subject-stat .pct.green { color: var(--green); }
        .subject-stat .pct.red { color: var(--red); }
        .subject-stat .pct.yellow { color: var(--yellow); }
        .subject-stat .bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 10px;
            overflow: hidden;
        }
        .subject-stat .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }
        .subject-stat .bar-fill.green { background: var(--green); }
        .subject-stat .bar-fill.red { background: var(--red); }
        .subject-stat .bar-fill.yellow { background: var(--yellow); }

        .target-big {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
        }
        .target-big .safe { color: var(--green); }
        .target-big .danger { color: var(--red); }
        .target-big .warning { color: var(--yellow); }
        .target-detail {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }

        .badge-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .badge-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            background: var(--bg);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .badge-item .icon { font-size: 16px; }
        .badge-item .num { font-weight: 700; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 30px 20px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal .subject-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .modal .subject-chip {
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal .subject-chip:active {
            transform: scale(0.95);
        }
        .modal .subject-chip.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .modal .subject-chip.lab-chip {
            background: var(--orange);
            border-color: var(--orange);
            color: white;
        }
        .modal .subject-chip.lab-chip.checked {
            background: var(--green);
            border-color: var(--green);
        }
        .modal .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal .btn-row button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal .btn-row button:active {
            transform: scale(0.95);
        }
        .modal .btn-row .btn-primary {
            background: var(--primary);
            color: white;
        }
        .modal .btn-row .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .modal .btn-row .btn-green {
            background: var(--green);
            color: white;
        }
        .modal .btn-row .btn-red {
            background: var(--red);
            color: white;
        }
        .modal .status-text {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 30px;
            border: none;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:active {
            transform: scale(0.9);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid var(--border);
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            max-width: 90%;
        }
        .toast.success { border-color: var(--green); }
        .toast.error { border-color: var(--red); }

        .modal .settings-field {
            margin-bottom: 12px;
        }
        .modal .settings-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .modal .settings-field input,
        .modal .settings-field select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .modal .settings-field input:focus {
            border-color: var(--primary);
        }

        @media (max-width: 400px) {
            .calendar-grid .day-cell {
                min-height: 34px;
                font-size: 11px;
            }
            .stats-grid .stat-item .number {
                font-size: 17px;
            }
            .modal .subject-chip {
                font-size: 12px;
                padding: 8px 14px;
            }
            .header h1 {
                font-size: 17px;
            }
            .target-big {
                font-size: 22px;
            }
            .subject-stat .name {
                font-size: 11px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 Attendance</h1>
        <div class="header-actions">
            <button onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <div class="card">
        <div class="month-nav">
            <button onclick="changeMonth(-1)">◀</button>
            <span class="month-label" id="monthLabel">July 2026</span>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="card">
        <div class="card-title">📊 Semester Summary</div>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="number blue" id="overallPercent">0%</div>
                <div class="label">Attendance</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalHours">0</div>
                <div class="label">Hours</div>
            </div>
            <div class="stat-item">
                <div class="number yellow" id="daysLogged">0</div>
                <div class="label">Days Logged</div>
            </div>
            <div class="stat-item">
                <div class="number green" id="streakCount">0</div>
                <div class="label">Streak</div>
            </div>
        </div>
        <div class="badge-row">
            <div class="badge-item">
                <span class="icon">💯</span>
                <span>Perfect: <span class="num" id="perfectDays">0</span></span>
            </div>
            <div class="badge-item">
                <span class="icon">🎯</span>
                <span>Target: <span class="num" id="targetStatus">75%</span></span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📖 Subject-wise Attendance</div>
        <div id="subjectStatsContainer"></div>
    </div>

    <div class="card">
        <div class="card-title">🎯 75% Target</div>
        <div class="target-big" id="targetDisplay">Calculating...</div>
        <div class="target-detail" id="targetDetail"></div>
    </div>

    <button class="fab" onclick="openLogger()">
        <span>+</span>
    </button>

    <div class="modal-overlay hidden" id="loggerModal">
        <div class="modal">
            <h2 id="loggerDate">Today's Attendance</h2>
            <div class="subject-grid" id="subjectContainer"></div>
            <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;">
                <button class="btn-green" onclick="markAllPresent()" style="padding:6px 16px;border:none;border-radius:30px;font-weight:600;cursor:pointer;">✅ All Present</button>
                <button class="btn-red" onclick="markAllAbsent()" style="padding:6px 16px;border:none;border-radius:30px;font-weight:600;cursor:pointer;">❌ All Absent</button>
            </div>
            <div class="btn-row">
                <button class="btn-outline" onclick="closeLogger()">Cancel</button>
                <button class="btn-primary" onclick="logToday()">💾 Log Today</button>
            </div>
            <div class="status-text" id="loggerStatus">Tap subjects above, then Log Today</div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal">
            <h2>⚙️ Settings</h2>
            
            <div class="settings-field">
                <label>Semester Start Date</label>
                <input type="date" id="semesterStart" value="2026-07-27">
            </div>
            <div class="settings-field">
                <label>Semester End Date</label>
                <input type="date" id="semesterEnd" value="2026-12-28">
            </div>
            <div class="settings-field">
                <label>Working Days</label>
                <select id="workingDays">
                    <option value="monday">Monday - Saturday</option>
                    <option value="sunday">Sunday - Friday</option>
                    <option value="all">All Days</option>
                </select>
            </div>
            <div class="settings-field">
                <label>GitHub Token (for backup)</label>
                <input type="password" id="githubToken" placeholder="Enter your GitHub Token">
            </div>
            <div class="settings-field">
                <label>GitHub Repo (username/repo)</label>
                <input type="text" id="githubRepo" placeholder="ajayyyx27/Nukes-retry">
            </div>
            
            <div class="btn-row" style="flex-wrap:wrap;">
                <button class="btn-outline" onclick="closeSettings()" style="flex:1;">Close</button>
                <button class="btn-primary" onclick="saveSettings()" style="flex:1;">Save</button>
            </div>
            <div style="margin-top:12px;">
                <button class="btn-red" onclick="resetAllData()" style="padding:8px 20px;border:none;border-radius:30px;font-weight:600;cursor:pointer;width:100%;">🗑️ Reset All Data</button>
            </div>
            <div style="margin-top:8px;">
                <button class="btn-primary" onclick="backupToGitHub()" style="padding:8px 20px;border:none;border-radius:30px;font-weight:600;cursor:pointer;width:100%;">☁️ Backup to GitHub</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

                    { period: 6, time: '2:55-3:55', subject: 'Sports', type: 'free', code: null }
                ]
            },
            'Saturday': {
                periods: [
                    { period: 1, time: '9:00-10:00', subject: 'BEEE', type: 'theory', code: 'BEEE' },
                    { period: 2, time: '10:00-11:00', subject: 'OOPJ', type: 'theory', code: 'OOPJ' },
                    { period: 3, time: '11:00-12:00', subject: 'DM', type: 'theory', code: 'DM' },
                    { period: 4, time: '12:10-1:10', subject: 'DBMS', type: 'theory', code: 'DBMS' },
                    { period: 5, time: '1:55-2:55', subject: 'IE', type: 'theory', code: 'IE' },
                    { period: 6, time: '2:55-3:55', subject: 'COA', type: 'theory', code: 'COA' }
                ]
            }
        };

        const SUBJECT_NAMES = {
            'DM': 'Discrete Maths',
            'COA': 'COA',
            'OOPJ': 'Java',
            'BEEE': 'BEEE',
            'DBMS': 'DBMS',
            'IE': 'I&E',
            'EBOX': 'E-BOX Lab',
            'EEE': 'EEE Lab',
            'OOPJ_LAB': 'Java Lab',
            'MONGODB': 'MongoDB Lab',
            'DBMS_LAB': 'DBMS Lab',
            'MENTOR': 'Mentoring',
            'CRT': 'CRT'
        };

        let appData = null;
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let loggerDate = null;

        function loadData() {
            const stored = localStorage.getItem('attendanceTrackerData');
            if (stored) {
                try {
                    appData = JSON.parse(stored);
                    if (!appData.semesters) appData.semesters = DEFAULT_DATA.semesters;
                    if (!appData.activeSemesterId) appData.activeSemesterId = DEFAULT_DATA.activeSemesterId;
                    if (!appData.settings) appData.settings = DEFAULT_DATA.settings;
                    if (!appData.settings.workingDays) appData.settings.workingDays = 'monday';
                    return;
                } catch (e) {
                    console.warn('Failed to parse stored data, using defaults');
                }
            }
            appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
            saveData();
        }

        function saveData() {
            try {
                localStorage.setItem('attendanceTrackerData', JSON.stringify(appData));
            } catch (e) {
                console.warn('Failed to save data:', e);
            }
        }

        function getActiveSemester() {
            return appData.semesters.find(s => s.id === appData.activeSemesterId) || appData.semesters[0];
        }

        function getSemesterRecords() {
            const sem = getActiveSemester();
            return sem.records || {};
        }

        function getExcusedDays() {
            const sem = getActiveSemester();
            return sem.excusedDays || {};
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function isWorkingDay(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const day = date.getDay();
            const settings = appData.settings;
            if (settings.workingDays === 'sunday') {
                return day !== 0;
            } else if (settings.workingDays === 'all') {
                return true;
            } else {
                return day !== 0;
            }
        }

        function getDayName(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][date.getDay()];
        }

        function getPeriodsForDay(dateStr) {
            const dayName = getDayName(dateStr);
            const timetable = TIMETABLE[dayName];
            if (!timetable) return [];
            return timetable.periods;
        }

        function getLabInfo(dateStr) {
            const periods = getPeriodsForDay(dateStr);
            const labPeriods = periods.filter(p => p.type === 'lab');
            if (labPeriods.length === 0) return null;
            return {
                code: labPeriods[0].code,
                name: SUBJECT_NAMES[labPeriods[0].code] || labPeriods[0].subject,
                count: labPeriods.length,
                periods: labPeriods.map(p => p.period)
            };
        }

        function getTheorySubjects(dateStr) {
            const periods = getPeriodsForDay(dateStr);
            const theory = periods.filter(p => p.type === 'theory' && p.code);
            return theory.map(p => ({
                code: p.code,
                name: SUBJECT_NAMES[p.code] || p.subject,
                period: p.period
            }));
        }

        function renderAll() {
            renderCalendar();
            renderStats();
            renderSubjectStats();
            renderTarget();
        }

        function renderCalendar() {
            const sem = getActiveSemester();
            const records = sem.records || {};
            const excused = sem.excusedDays || {};
            const today = getTodayString();
            
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            
            const container = document.getElementById('calendarGrid');
            const label = document.getElementById('monthLabel');
            label.textContent = new Date(currentYear, currentMonth).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
            
            let html = '';
            const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayLabels.forEach(d => {
                html += `<div class="day-label">${d}</div>`;
            });
            
            for (let i = 0; i < startDayOfWeek; i++) {
                html += `<div class="day-cell" style="opacity:0.2;"></div>`;
            }
            
            for (let d = 1; d <= lastDay.getDate(); d++) {
                const date = new Date(currentYear, currentMonth, d);
                const dateStr = date.toISOString().split('T')[0];
                const isToday = dateStr === today;
                const isPast = date <= new Date();
                const isExcused = excused[dateStr] || false;
                const isWorking = isWorkingDay(dateStr);
                const dayOfWeek = date.getDay();
                const isWeekend = dayOfWeek === 0;
                
                let cellClass = 'day-cell';
                let indicatorClass = 'gray';
                let content = d;
                
                if (!isPast) {
                    cellClass += ' future';
                } else if (isExcused) {
                    cellClass += ' excused';
                    indicatorClass = 'gray';
                } else if (isWeekend) {
                    cellClass += ' weekend';
                    indicatorClass = 'gray';
                } else if (records[dateStr] && records[dateStr]._logged) {
                    const hours = records[dateStr]._totalHours || 0;
                    const totalPeriods = getPeriodsForDay(dateStr).filter(p => p.type !== 'free' && p.code).length;
                    const pct = totalPeriods > 0 ? (hours / totalPeriods) * 100 : 0;
                    
                    if (pct >= 90) indicatorClass = 'green';
                    else if (pct >= 60) indicatorClass = 'yellow';
                    else if (pct >= 30) indicatorClass = 'orange';
                    else indicatorClass = 'red';
                } else if (isPast && isWorking && !isWeekend) {
                    indicatorClass = 'red';
                }
                
                if (isToday) cellClass += ' today';
                
                const clickHandler = isPast && isWorking && !isWeekend && !isExcused ? `onclick="openLoggerForDate('${dateStr}')"` : '';
                const excusedHandler = isPast && isWorking && !isWeekend ? `oncontextmenu="toggleExcused('${dateStr}');return false;"` : '';
                
                html += `
                    <div class="${cellClass}" ${clickHandler} ${excusedHandler}>
                        <span class="date">${content}</span>
                        <span class="indicator ${indicatorClass}"></span>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function renderStats() {
            const sem = getActiveSemester();
            const records = sem.records || {};
            const excused = sem.excusedDays || {};
            const startDate = new Date(sem.startDate + 'T00:00:00');
            const endDate = new Date(sem.endDate + 'T00:00:00');
            const today = new Date();
            
            let totalHours = 0;
            let totalPossible = 0;
            let daysLogged = 0;
            let perfectDays = 0;
            let streakDays = 0;
            let currentStreak = 0;

            let currentDate = new Date(startDate);
            while (currentDate <= endDate && currentDate <= today) {
                const dateStr = currentDate.toISOString().split('T')[0];
                const isExcused = excused[dateStr] || false;
                const isWorking = isWorkingDay(dateStr);
                
                if (isWorking && !isExcused) {
                    const periods = getPeriodsForDay(dateStr);
                    const theoryCount = periods.filter(p => p.type === 'theory' && p.code).length;
                    const labInfo = getLabInfo(dateStr);
                    const labHours = labInfo ? labInfo.count : 0;
                    const dayTotal = theoryCount + labHours;
                    totalPossible += dayTotal;
                    
                    if (records[dateStr] && records[dateStr]._logged) {
                        const hours = records[dateStr]._totalHours || 0;
                        totalHours += hours;
                        daysLogged++;
                        if (hours === dayTotal) perfectDays++;
                        currentStreak++;
                    } else {
                        if (currentStreak > streakDays) streakDays = currentStreak;
                        currentStreak = 0;
                    }
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            if (currentStreak > streakDays) streakDays = currentStreak;

            const percentage = totalPossible > 0 ? Math.round((totalHours / totalPossible) * 100) : 0;

            document.getElementById('overallPercent').textContent = percentage + '%';
            document.getElementById('totalHours').textContent = totalHours;
            document.getElementById('daysLogged').textContent = daysLogged;
            document.getElementById('streakCount').textContent = streakDays;
            document.getElementById('perfectDays').textContent = perfectDays;
            document.getElementById('targetStatus').textContent = percentage >= 75 ? '✅ 75%+' : percentage >= 60 ? '⚠️ 60%+' : '🚨 ' + percentage + '%';
        }

        function renderSubjectStats() {
            const sem = getActiveSemester();
            const records = sem.records || {};
            const excused = sem.excusedDays || {};
            const startDate = new Date(sem.startDate + 'T00:00:00');
            const endDate = new Date(sem.endDate + 'T00:00:00');
            const today = new Date();
            
            const subjectMap = {};
            let currentDate = new Date(startDate);
            while (currentDate <= endDate && currentDate <= today) {
                const dateStr = currentDate.toISOString().split('T')[0];
                const isExcused = excused[dateStr] || false;
                const isWorking = isWorkingDay(dateStr);
                
                if (isWorking && !isExcused) {
                    const periods = getPeriodsForDay(dateStr);
                    periods.forEach(p => {
                        if (p.code && p.type === 'theory') {
                            if (!subjectMap[p.code]) {
                                subjectMap[p.code] = { total: 0, attended: 0, name: SUBJECT_NAMES[p.code] || p.subject };
                            }
                            subjectMap[p.code].total += 1;
                            if (records[dateStr] && records[dateStr][p.code]) {
                                subjectMap[p.code].attended += 1;
                            }
                        }
                    });
                    const labInfo = getLabInfo(dateStr);
                    if (labInfo) {
                        if (!subjectMap[labInfo.code]) {
                            subjectMap[labInfo.code] = { total: 0, attended: 0, name: labInfo.name };
                        }
                        subjectMap[labInfo.code].total += labInfo.count;
                        if (records[dateStr] && records[dateStr][labInfo.code]) {
                            subjectMap[labInfo.code].attended += labInfo.count;
                        }
                    }
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }

            const container = document.getElementById('subjectStatsContainer');
            
            const entries = Object.entries(subjectMap).filter(([_, data]) => data.total > 0);
            if (entries.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:8px;">No subject data yet. Start logging!</div>';
                return;
            }

            let html = '';
            entries.forEach(([code, data]) => {
                const pct = data.total > 0 ? Math.round((data.attended / data.total) * 100) : 0;
                let colorClass = 'green';
                if (pct < 60) colorClass = 'red';
                else if (pct < 75) colorClass = 'yellow';
                
                html += `
                    <div class="subject-stat">
                        <span class="name">${data.name}</span>
                        <div class="bar">
                            <div class="bar-fill ${colorClass}" style="width:${Math.min(pct,100)}%"></div>
                        </div>
                        <span class="pct ${colorClass}">${pct}%</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderTarget() {
            const sem = getActiveSemester();
            const records = sem.records || {};
            const excused = sem.excusedDays || {};
            const startDate = new Date(sem.startDate + 'T00:00:00');
            const endDate = new Date(sem.endDate + 'T00:00:00');
        const today = new Date();
        
        let totalHours = 0;
        let totalPossible = 0;
        let remainingPossible = 0;

        let currentDate = new Date(startDate);
        while (currentDate <= endDate) {
            const dateStr = currentDate.toISOString().split('T')[0];
            const isExcused = excused[dateStr] || false;
            const isWorking = isWorkingDay(dateStr);
            const isPast = currentDate <= today;
            
            if (isWorking && !isExcused) {
                const periods = getPeriodsForDay(dateStr);
                const theoryCount = periods.filter(p => p.type === 'theory' && p.code).length;
                const labInfo = getLabInfo(dateStr);
                const labHours = labInfo ? labInfo.count : 0;
                const dayTotal = theoryCount + labHours;
                
                if (isPast) {
                    totalPossible += dayTotal;
                    if (records[dateStr] && records[dateStr]._logged) {
                        totalHours += records[dateStr]._totalHours || 0;
                    }
                } else {
                    remainingPossible += dayTotal;
                }
            }
            currentDate.setDate(currentDate.getDate() + 1);
        }

        const currentPct = totalPossible > 0 ? (totalHours / totalPossible) * 100 : 0;
        const targetPct = 75;
        
        const display = document.getElementById('targetDisplay');
        const detail = document.getElementById('targetDetail');

        if (totalPossible === 0) {
            display.textContent = '📊 No data yet';
            detail.textContent = 'Start logging to see your target!';
            return;
        }

        if (currentPct >= targetPct) {
            const maxTotal = totalPossible + remainingPossible;
            const targetTotal = 75 / 100 * maxTotal;
            const allowedBunk = maxTotal - targetTotal;
            const allowedBunkHours = Math.floor(allowedBunk - totalHours);
            const allowedFullDays = Math.floor(allowedBunkHours / 6);
            
            if (allowedBunkHours >= 0) {
                display.innerHTML = `🎉 <span class="safe">SAFE</span>`;
                detail.textContent = `You can bunk ${allowedFullDays} full days (${allowedBunkHours} hours) and stay above 75%!`;
            } else {
                display.innerHTML = `⚠️ <span class="warning">WARNING</span>`;
                detail.textContent = `You're above 75%, but you have no bunk budget left. Stay consistent!`;
            }
        } else {
            const targetTotal = targetPct / 100 * (totalPossible + remainingPossible);
            const hoursNeeded = Math.ceil(targetTotal - totalHours);
            const fullDaysNeeded = Math.ceil(hoursNeeded / 6);
            
            display.innerHTML = `🚨 <span class="danger">${currentPct.toFixed(1)}%</span>`;
            detail.textContent = `You need ${hoursNeeded} more hours (${fullDaysNeeded} full days) to reach 75%.`;
        }
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    function openLogger() {
        loggerDate = getTodayString();
        openLoggerForDate(loggerDate);
    }

    function openLoggerForDate(dateStr) {
        loggerDate = dateStr;
        const modal = document.getElementById('loggerModal');
        modal.classList.remove('hidden');
        
        const records = getSemesterRecords();
        const excused = getExcusedDays();
        
        const dateDisplay = document.getElementById('loggerDate');
        dateDisplay.textContent = new Date(dateStr).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
        
        if (excused[dateStr]) {
            document.getElementById('subjectContainer').innerHTML = `<div style="text-align:center;padding:12px;color:var(--text-muted);">🛑 This day is marked as excused.</div>`;
            document.getElementById('loggerStatus').textContent = 'Excused - no logging required';
            return;
        }
        
        if (!isWorkingDay(dateStr)) {
            document.getElementById('subjectContainer').innerHTML = `<div style="text-align:center;padding:12px;color:var(--text-muted);">🎉 Weekend / Holiday</div>`;
            document.getElementById('loggerStatus').textContent = 'No classes on this day';
            return;
        }
        
        const theorySubjects = getTheorySubjects(dateStr);
        const labInfo = getLabInfo(dateStr);
        const logged = records[dateStr] || {};
        
        let html = '';
        let totalChecked = 0;
        
        if (labInfo) {
            const isChecked = logged[labInfo.code] || false;
            if (isChecked) totalChecked += labInfo.count;
            html += `<div class="subject-chip lab-chip ${isChecked ? 'checked' : ''}" 
                         onclick="toggleSubject('${dateStr}','${labInfo.code}')">
                🧪 ${labInfo.name} (${labInfo.count}h)
            </div>`;
        }
        
        theorySubjects.forEach(sub => {
            const isChecked = logged[sub.code] || false;
            if (isChecked) totalChecked += 1;
            html += `<div class="subject-chip ${isChecked ? 'checked' : ''}" 
                         onclick="toggleSubject('${dateStr}','${sub.code}')">
                ${sub.name}
            </div>`;
        });
        
        document.getElementById('subjectContainer').innerHTML = html;
        
        const totalPeriods = theorySubjects.length + (labInfo ? labInfo.count : 0);
        document.getElementById('loggerStatus').textContent = `Selected: ${totalChecked} / ${totalPeriods} hours`;
    }

    function toggleSubject(dateStr, subjectCode) {
        const records = getSemesterRecords();
        if (!records[dateStr]) records[dateStr] = {};
        records[dateStr][subjectCode] = !records[dateStr][subjectCode];
        delete records[dateStr]._logged;
        saveData();
        openLoggerForDate(dateStr);
    }

    function markAllPresent() {
        const records = getSemesterRecords();
        if (!records[loggerDate]) records[loggerDate] = {};
        
        const theorySubjects = getTheorySubjects(loggerDate);
        const labInfo = getLabInfo(loggerDate);
        
        theorySubjects.forEach(sub => {
            records[loggerDate][sub.code] = true;
        });
        if (labInfo) {
            records[loggerDate][labInfo.code] = true;
        }
        delete records[loggerDate]._logged;
        saveData();
        openLoggerForDate(loggerDate);
        showToast('✅ All marked present!', 'success');
    }

    function markAllAbsent() {
        const records = getSemesterRecords();
        if (!records[loggerDate]) records[loggerDate] = {};
        
        const theorySubjects = getTheorySubjects(loggerDate);
        const labInfo = getLabInfo(loggerDate);
        
        theorySubjects.forEach(sub => {
            records[loggerDate][sub.code] = false;
        });
        if (labInfo) {
            records[loggerDate][labInfo.code] = false;
        }
        delete records[loggerDate]._logged;
        saveData();
        openLoggerForDate(loggerDate);
        showToast('❌ All marked absent', 'info');
    }

    function logToday() {
        const records = getSemesterRecords();
        
        const excused = getExcusedDays();
        if (excused[loggerDate]) {
            showToast('This day is excused. No logging needed.', 'info');
            closeLogger();
            return;
        }
        if (!isWorkingDay(loggerDate)) {
            showToast('Weekend/Holiday!', 'info');
            closeLogger();
            return;
        }
        
        if (!records[loggerDate]) records[loggerDate] = {};
        
        const theorySubjects = getTheorySubjects(loggerDate);
        const labInfo = getLabInfo(loggerDate);
        let totalChecked = 0;
        
        theorySubjects.forEach(sub => {
            if (records[loggerDate][sub.code]) totalChecked++;
        });
        if (labInfo && records[loggerDate][labInfo.code]) {
            totalChecked += labInfo.count;
        }
        
        const totalPeriods = theorySubjects.length + (labInfo ? labInfo.count : 0);
        
        if (totalChecked === 0) {
            showToast('⚠️ You haven\'t marked any subjects!', 'error');
            return;
        }
        
        records[loggerDate]._logged = true;
        records[loggerDate]._totalHours = totalChecked;
        saveData();
        closeLogger();
        renderAll();
        showToast(`✅ Logged ${totalChecked}/${totalPeriods} hours!`, 'success');
    }

    function closeLogger() {
        document.getElementById('loggerModal').classList.add('hidden');
    }

    function toggleExcused(dateStr) {
        const sem = getActiveSemester();
        if (!sem.excusedDays) sem.excusedDays = {};
        if (sem.excusedDays[dateStr]) {
            delete sem.excusedDays[dateStr];
            showToast('Removed excused status', 'info');
        } else {
            sem.excusedDays[dateStr] = true;
            if (sem.records && sem.records[dateStr]) {
                delete sem.records[dateStr];
            }
            showToast('Marked as excused ✅', 'success');
        }
        saveData();
        renderAll();
    }

    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type || ''}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.remove();
        }, 3000);
    }

    function openSettings() {
        document.getElementById('settingsModal').classList.remove('hidden');
        const sem = getActiveSemester();
        document.getElementById('semesterStart').value = sem.startDate || '';
        document.getElementById('semesterEnd').value = sem.endDate || '';
        document.getElementById('workingDays').value = appData.settings.workingDays || 'monday';
        document.getElementById('githubToken').value = appData.settings.githubToken || '';
        document.getElementById('githubRepo').value = appData.settings.githubRepo || '';
    }

    function closeSettings() {
        document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
        const sem = getActiveSemester();
        sem.startDate = document.getElementById('semesterStart').value;
        sem.endDate = document.getElementById('semesterEnd').value;
        appData.settings.workingDays = document.getElementById('workingDays').value;
        appData.settings.githubToken = document.getElementById('githubToken').value;
        appData.settings.githubRepo = document.getElementById('githubRepo').value;
        saveData();
        closeSettings();
        renderAll();
        showToast('✅ Settings saved!', 'success');
    }

    function backupToGitHub() {
        const token = appData.settings.githubToken;
        const repo = appData.settings.githubRepo;
        
        if (!token || !repo) {
            showToast('⚠️ Set GitHub Token and Repo in Settings first!', 'error');
            return;
        }
        
        const dataStr = JSON.stringify(appData, null, 2);
        const content = btoa(unescape(encodeURIComponent(dataStr)));
        const path = 'attendance_backup.json';
        const url = `https://api.github.com/repos/${repo}/contents/${path}`;
        
        fetch(url, {
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        })
        .then(res => {
            if (res.status === 404) {
                return fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Backup attendance - ${new Date().toISOString().split('T')[0]}`,
                        content: content
                    })
                });
            } else if (res.ok) {
                return res.json().then(data => {
                    return fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Update backup - ${new Date().toISOString().split('T')[0]}`,
                            content: content,
                            sha: data.sha
                        })
                    });
                });
            } else {
                throw new Error('Failed to check file');
            }
        })
        .then(res => {
            if (res.ok) {
                showToast('☁️ Backed up to GitHub!', 'success');
            } else {
                throw new Error('Backup failed');
            }
        })
        .catch(err => {
            showToast('❌ Backup failed: ' + err.message, 'error');
        });
    }

    function resetAllData() {
        if (confirm('⚠️ Delete ALL data? This cannot be undone!')) {
            if (confirm('Really? All attendance records will be lost!')) {
                localStorage.removeItem('attendanceTrackerData');
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveData();
                renderAll();
                showToast('🗑️ All data reset', 'info');
                closeSettings();
            }
        }
    }

        loadData();
        renderAll();
        setInterval(saveData, 30000);
