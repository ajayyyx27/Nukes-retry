<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Tracker</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%234F46E5'/><stop offset='100%25' style='stop-color:%2306B6D4'/></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><circle cx='50' cy='50' r='38' fill='none' stroke='rgba(255,255,255,0.4)' stroke-width='5' stroke-dasharray='180 240' stroke-linecap='round'/><path d='M30 55 L45 70 L75 35' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252540;
            --text: #e8e8f0;
            --text-muted: #8899aa;
            --primary: #4F46E5;
            --primary-glow: #06B6D4;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --orange: #f59e0b;
            --border: #2a2a44;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f0f2f8;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f7ff;
                --text: #1a1a2e;
                --text-muted: #6b7280;
                --border: #d1d5db;
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px 16px 100px 16px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .header-actions button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-actions button:active {
            transform: scale(0.95);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .month-nav button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .month-nav button:active {
            transform: scale(0.95);
        }
        .month-nav .month-label {
            font-size: 16px;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-grid .day-label {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 4px 0;
        }
        .calendar-grid .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            min-height: 40px;
        }
        .calendar-grid .day-cell:active {
            transform: scale(0.92);
        }
        .calendar-grid .day-cell .date {
            font-size: 13px;
            font-weight: 600;
        }
        .calendar-grid .day-cell .indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            margin-top: 2px;
        }
        .calendar-grid .day-cell .indicator.green { background: var(--green); }
        .calendar-grid .day-cell .indicator.yellow { background: var(--yellow); }
        .calendar-grid .day-cell .indicator.orange { background: var(--orange); }
        .calendar-grid .day-cell .indicator.red { background: var(--red); }
        .calendar-grid .day-cell .indicator.gray { background: var(--text-muted); opacity: 0.3; }
        .calendar-grid .day-cell.today {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(79, 70, 229, 0.25);
        }
        .calendar-grid .day-cell.future {
            opacity: 0.4;
            cursor: default;
        }
        .calendar-grid .day-cell.weekend {
            opacity: 0.3;
            cursor: default;
        }
        .calendar-grid .day-cell.excused {
            border-style: dashed;
            border-color: var(--primary);
            opacity: 0.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .stats-grid .stat-item {
            text-align: center;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 10px 4px;
            border: 1px solid var(--border);
        }
        .stats-grid .stat-item .number {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
        }
        .stats-grid .stat-item .number.green { color: var(--green); }
        .stats-grid .stat-item .number.red { color: var(--red); }
        .stats-grid .stat-item .number.blue { color: var(--primary); }
        .stats-grid .stat-item .number.yellow { color: var(--yellow); }
        .stats-grid .stat-item .label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .subject-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .subject-stat:last-child {
            border-bottom: none;
        }
        .subject-stat .name {
            font-weight: 500;
            font-size: 13px;
            min-width: 80px;
        }
        .subject-stat .pct {
            font-weight: 700;
            font-size: 13px;
            min-width: 40px;
            text-align: right;
        }
        .subject-stat .pct.green { color: var(--green); }
        .subject-stat .pct.red { color: var(--red); }
        .subject-stat .pct.yellow { color: var(--yellow); }
        .subject-stat .bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 10px;
            overflow: hidden;
        }
        .subject-stat .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }
        .subject-stat .bar-fill.green { background: var(--green); }
        .subject-stat .bar-fill.red { background: var(--red); }
        .subject-stat .bar-fill.yellow { background: var(--yellow); }

        .target-big {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
        }
        .target-big .safe { color: var(--green); }
        .target-big .danger { color: var(--red); }
        .target-big .warning { color: var(--yellow); }
        .target-detail {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }

        .badge-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .badge-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            background: var(--bg);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .badge-item .icon { font-size: 16px; }
        .badge-item .num { font-weight: 700; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 30px 20px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal .subject-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .modal .subject-chip {
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal .subject-chip:active {
            transform: scale(0.95);
        }
        .modal .subject-chip.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .modal .subject-chip.lab-chip {
            background: var(--orange);
            border-color: var(--orange);
            color: white;
        }
        .modal .subject-chip.lab-chip.checked {
            background: var(--green);
            border-color: var(--green);
        }
        .modal .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal .btn-row button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal .btn-row button:active {
            transform: scale(0.95);
        }
        .modal .btn-row .btn-primary {
            background: var(--primary);
            color: white;
        }
        .modal .btn-row .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .modal .btn-row .btn-green {
            background: var(--green);
            color: white;
        }
        .modal .btn-row .btn-red {
            background: var(--red);
            color: white;
        }
        .modal .status-text {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 30px;
            border: none;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:active {
            transform: scale(0.9);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid var(--border);
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            max-width: 90%;
        }
        .toast.success { border-color: var(--green); }
        .toast.error { border-color: var(--red); }

        .modal .settings-field {
            margin-bottom: 12px;
        }
        .modal .settings-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .modal .settings-field input,
        .modal .settings-field select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .modal .settings-field input:focus {
            border-color: var(--primary);
        }

        @media (max-width: 400px) {
            .calendar-grid .day-cell {
                min-height: 34px;
                font-size: 11px;
            }
            .stats-grid .stat-item .number {
                font-size: 17px;
            }
            .modal .subject-chip {
                font-size: 12px;
                padding: 8px 14px;
            }
            .header h1 {
                font-size: 17px;
            }
            .target-big {
                font-size: 22px;
            }
            .subject-stat .name {
                font-size: 11px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 Attendance</h1>
        <div class="header-actions">
            <button onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <div class="card">
        <div class="month-nav">
            <button onclick="changeMonth(-1)">◀</button>
            <span class="month-label" id="monthLabel">July 2026</span>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="card">
        <div class="card-title">📊 Semester Summary</div>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="number blue" id="overallPercent">0%</div>
                <div class="label">Attendance</div>
            </div>
            <div class="stat-item">
                <div class="number" id="totalHours">0</div>
                <div class="label">Hours</div>
            </div>
            <div class="stat-item">
                <div class="number yellow" id="daysLogged">0</div>
                <div class="label">Days Logged</div>
            </div>
            <div class="stat-item">
                <div class="number green" id="streakCount">0</div>
                <div class="label">Streak</div>
            </div>
        </div>
        <div class="badge-row">
            <div class="badge-item">
                <span class="icon">💯</span>
                <span>Perfect: <span class="num" id="perfectDays">0</span></span>
            </div>
            <div class="badge-item">
                <span class="icon">🎯</span>
                <span>Target: <span class="num" id="targetStatus">75%</span></span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📖 Subject-wise Attendance</div>
        <div id="subjectStatsContainer"></div>
    </div>

    <div class="card">
        <div class="card-title">🎯 75% Target</div>
        <div class="target-big" id="targetDisplay">Calculating...</div>
        <div class="target-detail" id="targetDetail"></div>
    </div>

    <button class="fab" onclick="openLogger()">
        <span>+</span>
    </button>

    <div class="modal-overlay hidden" id="loggerModal">
        <div class="modal">
            <h2 id="loggerDate">Today's Attendance</h2>
            <div class="subject-grid" id="subjectContainer"></div>
            <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;">
                <button class="btn-green" onclick="markAllPresent()" style="padding:6px 16px;border:none;border-radius:30px;font-weight:600;cursor:pointer;">✅ All Present</button>
                <button class="btn-red" onclick="markAllAbsent()" style="padding:6px 16px;border:none;border-radius:30px;font-weight:600;cursor:pointer;">❌ All Absent</button>
            </div>
            <div class="btn-row">
                <button class="btn-outline" onclick="closeLogger()">Cancel</button>
                <button class="btn-primary" onclick="logToday()">💾 Log Today</button>
            </div>
            <div class="status-text" id="loggerStatus">Tap subjects above, then Log Today</div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal">
            <h2>⚙️ Settings</h2>
            
            <div class="settings-field">
                <label>Semester Start Date</label>
                <input type="date" id="semesterStart" value="2026-07-27">
            </div>
            <div class="settings-field">
                <label>Semester End Date</label>
                <input type="date" id="semesterEnd" value="2026-12-28">
            </div>
            <div class="settings-field">
                <label>Working Days</label>
                <select id="workingDays">
                    <option value="monday">Monday - Saturday</option>
                    <option value="sunday">Sunday - Friday</option>
                    <option value="all">All Days</option>
                </select>
            </div>
            <div class="settings-field">
                <label>GitHub Token (for backup)</label>
                <input type="password" id="g
